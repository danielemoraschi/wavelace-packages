# Publish a package when its tag arrives (formula-v0.1.0, the folder, then the version): test it, publish it to
# npm with provenance, and release it here. Everything in this repo is generated in the Wavelace source and sent with the tag, this
# file included, so a change made here is overwritten by the next version.
# npm: trusted publishing (OIDC) alone, the package naming this workflow as its trusted publisher, with direct
# publish allowed. No token is passed: npm would use one instead, and the package refuses tokens.
# A failed run is re-run here, never sent again: a version already on npm is skipped, and the release still made.
name: Publish
on:
  push:
    tags: ["*-v*"]
permissions:
  contents: write   # the release
  id-token: write   # npm's trusted publishing, and the provenance statement
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24   # and no registry option: it writes a token line for npm, and a placeholder token npm would send
      - name: An npm that publishes through OIDC
        run: npm install -g npm@^11.5.1 && npm --version
      - name: The tag names a package's folder, and the version its package says
        run: |
          PACKAGE=${GITHUB_REF_NAME%-v*}
          version=$(node -p "require('./$PACKAGE/package.json').version")
          test "$PACKAGE-v$version" = "$GITHUB_REF_NAME"
          { echo "PACKAGE=$PACKAGE"; echo "VERSION=$version"; echo "NAME=$(node -p "require('./$PACKAGE/package.json').name")"; } >> "$GITHUB_ENV"
      - name: React, which the /react subpath's test renders with
        run: npm install --prefix "$PACKAGE" --no-save --no-package-lock --no-audit --no-fund react@19.3.0 react-dom@19.3.0   # node_modules is never packed into the tarball
      - name: Test
        run: node --test "$PACKAGE/$PACKAGE.test.mjs"   # the file: given a folder, node --test runs it as one empty test and passes
      - name: Publish
        run: |
          cd "$PACKAGE"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "already on npm, so this is a re-run: on to the release"
          else
            npm publish --provenance --access public
          fi
      - name: Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "already released, so this is a re-run: nothing left to do"
          else
            gh release create "$GITHUB_REF_NAME" --title "$NAME $VERSION" \
              --notes "Published to npm with provenance: https://www.npmjs.com/package/$NAME/v/$VERSION"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
